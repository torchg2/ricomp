<style>
:root{
--bg:#f7f6f3;--card:#fff;--line:#e5e3dc;--line2:#cfccc2;
--tx:#23231f;--tx2:#6b6a63;--tx3:#9a988f;
--acc:#3f6fb5;--accbg:#e9f0fa;--ok:#2f8f68;--okbg:#e4f3ec;
--warn:#a9691c;--warnbg:#fbf1de;--dn:#b04a4a;--orange:#d8722f;
}
@media (prefers-color-scheme:dark){:root{
--bg:#161619;--card:#1f1f24;--line:#31313a;--line2:#45454f;
--tx:#eceae4;--tx2:#a4a29b;--tx3:#78766f;
--acc:#7ba7e6;--accbg:#1f2a3a;--ok:#5fc79a;--okbg:#1b2c26;
--warn:#e0a65a;--warnbg:#2d2418;--dn:#e08585;--orange:#e08a4a;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:0 0 80px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line2);
border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.hd{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav{display:flex;align-items:center;gap:2px}
.dnav button{width:34px;height:34px;border-radius:8px;color:var(--tx2);font-size:19px}
.dnav button:active{background:var(--line)}
.dt{font-size:15px;font-weight:600;min-width:0}
.dt small{display:block;font-size:11.5px;font-weight:400;color:var(--tx3)}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:6px 11px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 14px;padding:13px 14px}
.sec{margin:16px 14px}
h2{font-size:16px;font-weight:600;margin:0 0 8px}
h3{font-size:14px;font-weight:600;margin:0 0 4px}
p{margin:0 0 8px}
.mut{color:var(--tx2);font-size:12.5px}
.mut3{color:var(--tx3);font-size:11.5px}
.big{font-size:28px;font-weight:600;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.sp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar.g i{background:var(--tx3)}
.bar.s{height:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.mini{font-size:11.5px;color:var(--tx2);display:flex;justify-content:space-between;margin-bottom:3px}
.mini b{color:var(--tx);font-weight:500}
.meal{border-top:1px solid var(--line);padding:11px 0}
.meal:first-child{border-top:none}
.it{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px;color:var(--tx2)}
.it button{color:var(--tx3);font-size:17px;padding:0 6px;line-height:1}
.badd{border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--tx2)}
.badd:active{background:var(--line)}
.pill{border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--tx3)}
.pill.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{padding:8px 0 9px;font-size:10.5px;color:var(--tx3);text-align:center}
.tabs button.on{color:var(--acc)}
.tabs svg{display:block;margin:0 auto 2px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheetb{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;
max-height:92vh;display:flex;flex-direction:column}
.shhd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.shbody{overflow-y:auto;padding:0 14px 24px;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line2);border-radius:16px;padding:6px 12px;font-size:12.5px;color:var(--tx2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.li{border-bottom:1px solid var(--line);padding:11px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.li .t{font-size:14px}
.li .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.qt{display:flex;align-items:center;gap:8px;margin:12px 0}
.qt button{width:52px;height:42px;border:1px solid var(--line2);border-radius:8px;font-size:14px;color:var(--tx2);flex:none}
.qt input{text-align:center;font-size:17px}
.pset{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pset button{border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--tx2)}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border-radius:10px;padding:12px;
font-size:15px;font-weight:500;text-align:center;margin-top:8px}
.btn.sec{background:none;border:1px solid var(--line2);color:var(--tx2)}
.exr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.exr:last-child{border-bottom:none}
.exr .n{flex:1;min-width:0;font-size:13.5px}
.exr .p{font-size:11.5px;color:var(--tx3)}
.pm{width:40px;height:36px;border:1px solid var(--line2);border-radius:8px;font-size:17px;color:var(--tx3);flex:none}
.pm.up{background:var(--ok);border-color:var(--ok);color:#fff}
.pm.dn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g4 button{padding:11px 0;border:1px solid var(--line2);border-radius:8px;font-size:14px;color:var(--tx2)}
.g4 button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{background:var(--accbg);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--acc);margin-top:11px;line-height:1.5}
.tip.w{background:var(--warnbg);color:var(--warn)}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:none}
details>summary{padding:11px 2px;font-size:14px;cursor:pointer;list-style:none;display:flex;
justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--tx3);font-size:17px;flex:none}
details[open]>summary::after{content:"\2212"}
.dgw svg{width:100%;height:auto;display:block;margin:6px 0}
.att{background:var(--warnbg);border-left:3px solid var(--warn);padding:8px 10px 8px 26px;margin:6px 0 4px;
font-size:12.5px;line-height:1.5}
.att li{margin-bottom:3px}
.toast{position:fixed;left:14px;right:14px;bottom:88px;z-index:60;background:var(--tx);color:var(--bg);
border-radius:10px;padding:11px 14px;font-size:13.5px;display:flex;justify-content:space-between;
align-items:center;max-width:532px;margin:0 auto}
.toast button{color:var(--bg);text-decoration:underline;font-size:13.5px}
ul{padding-left:18px;margin:0 0 8px}
</style>
</head>

a il suo range.","Settimana 1: 2 serie da 8 SENZA manubri e range corto, poi aspetta 48 ore e valuta come stai. Dalla settimana 2 entrano i manubri.","Se senti pizzicare l'inguine, accorcia il range. Se fa male davvero, togli l'esercizio: ponte e abduzione coprono il lavoro che conta."],"svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" class=\"dg\" width=\"440\" viewBox=\"0 0 340 156\" preserveAspectRatio=\"xMidYMid meet\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#C2703A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><line x1=\"170\" y1=\"18\" x2=\"170\" y2=\"148\" stroke=\"#C4C2BA\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/><g transform=\"translate(0,0)\"><text x=\"79\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" font-family=\"Helvetica,Arial\" font-weight=\"bold\" fill=\"#2C2C2A\">Partenza</text><line x1=\"6\" y1=\"138\" x2=\"152\" y2=\"138\" stroke=\"#C4C2BA\" stroke-width=\"2\"/><circle cx=\"56\" cy=\"42\" r=\"9\" fill=\"none\" stroke=\"#2C2C2A\" stroke-width=\"2.2\"/><line x1=\"56\" y1=\"51\" x2=\"56\" y2=\"96\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"56\" y1=\"56\" x2=\"58\" y2=\"78\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"58\" y1=\"78\" x2=\"60\" y2=\"100\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"55\" y=\"100.5\" width=\"14\" height=\"7\" rx=\"2\" fill=\"#5F5E5A\"/><line x1=\"56\" y1=\"96\" x2=\"56\" y2=\"118\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"56\" y1=\"118\" x2=\"56\" y2=\"138\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><line x1=\"56\" y1=\"138\" x2=\"68\" y2=\"138\" stroke=\"#2C2C2A\" stroke-width=\"2.2\" stroke-linecap=\"round\"/></g><g transform=\"translate(182,0)\"><text x=\"79\" y=\"14\" te  (clamshell) con l'elastico","3 x 15 per lato"],["Stacco rumeno con i manubri","3 x 12-15"],["Affondo indietro a range ridotto","2 x 8 per lato, dalla sett. 4"],["Dead bug","3 x 8 per lato"],["Plank laterale sulle ginocchia","2 x 20-30 s per lato"]]},"C":{"nome":"Parte alta, spinta","ex":[["Piegamenti sulle braccia","4 x 8-12"],["Lento avanti con l'elastico","3 x 15"],["Trazioni alla sbarra","3 x 4-5, presa larga"],["Rematore in piedi con l'elastico","3 x 15"],["Alzate laterali con i manubri","3 x 15-20"],["Plank con tocco spalla","3 x 8 per lato"]]},"D":{"nome":"Circuito total body","ex":[["Piegamenti sulle braccia","4 giri x 40 s"],["Rematore da seduto con l'elastico","4 giri x 40 s"],["Ponte glutei a terra","4 giri x 40 s"],["Abduzione in piedi con l'elastico","4 giri x 40 s"],["Plank sulle mani","4 giri x 40 s"],["Corda per saltare","4 giri x 40 s, facoltativa"]]}},"fuori":[{"t":"Insalatona con pollo","d":"Pollo grigliato 150 g, verdure a volonta, pane 80 g, olio 1 cucchiaio e mezzo","m":"~660 kcal, ~42 g P","n":"La scelta piu sicura ovunque. Chiedi il condimento a parte."},{"t":"Pesce alla griglia","d":"Orata o spigola intera, patate al forno o verdure, pane 60 g","m":"~680 kcal, ~44 g P","n":"Al ristorante e la scelta migliore in assoluto."},{"t":"Poke bowl","d":"Base riso, salmone o pollo, edamame, verdure, no salse cremose","m":"~700 kcal, ~35 g P","n":"Occhio alle salse: possono valere 200 kcal da sole."},{"t":"Bresaola, rucola e grana","d":"Bresaola 100 g, grana 20 g, rucola, pane 100 g, olio 1 cucchiaio","m":"~640 kcal, ~44 g P","n":"Molto sale. Non due volte nella stessa settimana."},{"t":"Primo e secondo (mensa)","d":"Pasta al pomodoro porzione normale, pollo o pesce 150 g, verdure","m":"~700 kcal, ~45 g P","n":"Salta il pane se prendi il primo."},{"t":"Panino di emergenza","d":"Panino integrale con pollo o bresaola e verdure, no maionese","m":"~550 kcal, ~30 g P","n":"Il piu debole. Recupera scegliendo lo spuntino 2 o 3."}],"targets":{"train":{"k":2215 var KEY = "ricomp_v1";
var MEALKEYS = [["colazione","Colazione"],["pranzo","Pranzo"],["spuntino","Spuntino"],["cena","Cena"]];
var DOW = ["Domenica","Lunedi","Martedi","Mercoledi","Giovedi","Venerdi","Sabato"];
var MON = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

var S = load(), tab = "oggi", cur = today(), sheet = null, undo = null;

function today(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ var a=s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
function shift(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function label(s){ var d=parse(s); return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function r0(n){ return Math.round(n); }
function r1(n){ return Math.round(n*10)/10; }

function blank(){ return { days:{}, weights:{}, meas:{}, work:{}, custom:{}, over:{},
  sched:{"1":"A","2":"B","4":"C","6":"D"}, recents:[], lastBackup:null }; }
function load(){ try{ var raw=localStorage.getItem(KEY); if(!raw) return blank();
  var o=JSON.parse(raw), b=blank(); for(var k in b) if(!(k in o)) o[k]=b[k]; return o;
}catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }
catch(e){ alert("Il browser non riesce a salvare. Fai subito un backup dal tab Misure."); } }

function food(n){ return S.over[n] || DB.foods[n] || S.custom[n] || null; }
function allFoodNames(){ var a=Object.keys(DB.foods); for(var k in S.custom) if(a.indexOf(k)<0) a.push(k); return a.sort(); }

function day(d){
  if(!S.days[d]) S.days[d]={train:null,meals:{},supp:{},water:0};
  var x=S.days[d];
  if(!x.meals) x.meals={};
  MEALKEYS.forEach(function(m){ if(!x.meals[m[0]]) x.meals[m[0]]=[]; });
  if(!x.supp) x.supp={};
  return x;
}
function isTrain(d){ var x=day(d);
  if(x.train===true||x.train===false) return x.train;
  return !!S.sched[String(parse(d).getDay())]; }
function totals(d){ var x=day(d), t={k:0,p:0,f:0,c:0,fib:0};
  MEALKEYS.forEach(function(m){ x.meals[m[0]].forEach(function(i){
    t.k+=i.k; t.p+=i.p; t.f+=i.f; t.c+=i.c; t.fib+=i.fib||0; }); });
  return t; }
function target(d){ return isTrain(d) ? DB.targets.train : DB.targets.rest; }
function macroOf(n,g){ var v=food(n); if(!v) return null;
  return {n:n,g:g,k:v[0]*g/100,p:v[1]*g/100,f:v[2]*g/100,c:v[3]*g/100,fib:v[4]*g/100,src:n}; }

function addItem(d,mk,it){ day(d).meals[mk].push(it);
  if(it.src){ S.recents=[it.src].concat(S.recents.filter(function(x){return x!==it.src;})).slice(0,14); }
  save(); render(); }
function delItem(d,mk,i){ var it=day(d).meals[mk][i]; day(d).meals[mk].splice(i,1); save();
  undo=function(){ day(d).meals[mk].splice(i,0,it); save(); render(); };
  toast("Eliminato"); render(); }
function toast(msg){ var el=document.getElementById("toast");
  el.innerHTML='<div class="toast"><span>'+esc(msg)+'</span><button id="undob">Annulla</button></div>';
  var tm=setTimeout(function(){ el.innerHTML=""; undo=null; },5000);
  document.getElementById("undob").onclick=function(){ clearTimeout(tm); el.innerHTML=""; if(undo) undo(); undo=null; }; }

function mbar(lab,v,tgt,u){ var pct=Math.min(100,v/tgt*100);
  return '<div><div class="mini"><span>'+lab+'</span><b>'+v+u+'</b></div><div class="bar s g"><i style="width:'+pct+'%"></i></div></div>'; }

function openSheet(mk){ sheet={mk:mk,mode:"pasti",q:"",sel:null,g:100}; render(); }
function closeSheet(){ sheet=null; render(); }

function viewSheet(){

  var h='<div class="sheet" id="shbg"><div class="sheetb"><div class="shhd"><b>'+nm+'</b>'+

  if(s.sel){ return h+viewQty()+'</div></div></div>'; }

  var modes=[["pasti","Pasti del piano"],["cibi","Alimenti"],["piatti","Piatti tipici"],["nuovo","Nuovo"],["stima","Stima rapida"]];
  h+='<div class="chips">'+modes.map(function(m){ return '<button class="chip '+(s.mode===m[0]?"on":"")+'" data-act="mode" data-k="'+m[0]+'">'+m[1]+'</button>'; }).join("")+'</div>';

  if(s.mode==="pasti"){

  }
  if(s.mode==="cibi"||s.mode==="piatti"){
    h+='<input id="q" placeholder="'+(s.mode==="cibi"?"Cerca alimento":"Cerca piatto")+'" value="'+esc(s.q)+'">';
  }
  if(s.mode==="cibi"){
    var names=allFoodNames();
    if(s.q) names=names.filter(function(n){ return norm(n).indexOf(norm(s.q))>=0; });
    else { var rec=S.recents.filter(function(n){ return !!food(n); });
      names=rec.concat(names.filter(function(n){ return rec.indexOf(n)<0; }));
      if(rec.length) h+='<p class="mut3" style="margin:10px 0 0">Usati di recente in cima</p>'; }
    names.slice(0,70).forEach(function(n){ var v=food(n);

        '<div class="t">'+esc(n)+'</div><div class="s">100 g: '+r0(v[0])+' kcal &middot; '+r1(v[1])+' g P</div></div>'+
        '<button class="badd" data-act="editfood" data-n="'+esc(n)+'">Valori</button></div>'; });
  }
  if(s.mode==="piatti"){
    DB.piatti.filter(function(p){ return !s.q||norm(p.t).indexOf(norm(s.q))>=0; }).forEach(function(p){
      h+='<div class="li"><div style="flex:1;min-width:0"><div class="t">'+esc(p.t)+'</div>'+
        '<div class="s">'+p.k+' kcal &middot; '+p.p+' g P &middot; stima &plusmn;20%</div></div>'+
        '<div class="row" style="gap:6px"><button class="badd" data-act="dish" data-t="'+esc(p.t)+'" data-q="0.5">&frac12;</button>'+
        '<button class="badd" data-act="dish" data-t="'+esc(p.t)+'" data-q="1">1</button></div></div>'; });
  }
  if(s.mode==="nuovo"){
    h+='<h3 style="margin-top:12px">Nuovo alimento</h3><p class="mut3">Valori per 100 g, dall\'etichetta. Resta salvato per sempre.</p>'+
      '<div style="display:grid;gap:8px;margin-top:10px"><input id="nf_n" placeholder="Nome">'+
      '<div class="g2"><input id="nf_k" type="number" inputmode="decimal" placeholder="kcal">'+
      '<input id="nf_p" type="number" inputmode="decimal" placeholder="Proteine g"></div>'+
      '<div class="g2"><input id="nf_f" type="number" inputmode="decimal" placeholder="Grassi g">'+
      '<input id="nf_c" type="number" inputmode="decimal" placeholder="Carboidrati g"></div>'+
      '<input id="nf_fib" type="number" inputmode="decimal" placeholder="Fibra g (opzionale)">'+
      '<button class="btn" data-act="savenew">Salva alimento</button></div>';
  }
  if(s.mode==="stima"){
    h+='<h3 style="margin-top:12px">Stima rapida</h3><p class="mut3">Per quello che non puoi pesare. Meglio un numero approssimativo che una giornata non registrata.</p>'+
      '<div style="display:grid;gap:8px;margin-top:10px"><input id="st_n" placeholder="Descrizione (es. pizza al ristorante)">'+
      '<div class="g2"><input id="st_k" type="number" inputmode="decimal" placeholder="kcal stimate">'+
      '<input id="st_p" type="number" inputmode="decimal" placeholder="Proteine g"></div>'+
      '<button class="btn" data-act="savestima">Aggiungi</button></div>';
  }
  return h+'</div></div></div>';
}
function norm(t){ return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function wk(d){ if(!S.work[d]) S.work[d]={}; return S.work[d]; }
function sedutaDi(d){ var w=S.work[d]; if(w&&w.seduta) return w.seduta; return S.sched[String(parse(d).getDay())]||null; }

function viewAllen(){
  var d=cur, sid=sedutaDi(d), w=wk(d);
  var h='<div class="hd"><div class="hdr"><div class="dnav"><button data-act="prev">&#8249;</button>'+
    '<div class="dt">'+label(d)+'<small>'+(d===today()?"Oggi":"&nbsp;")+'</small></div>'+
    '<button data-act="next">&#8250;</button></div></div></div>';

  if(!sid){
    h+='<div class="card"><h3>Giorno di riposo</h3><p class="mut">Nessuna seduta prevista oggi dal tuo calendario.</p>'+
      '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">'+
      ["A","B","C","D"].map(function(k){ return '<button class="badd" data-act="setsed" data-s="'+k+'">Ho fatto '+k+'</button>'; }).join("")+'</div></div>';
  } else {
    var sd=DB.sedute[sid];
    h+='<div class="card"><div class="sp"><div><h3 style="margin:0">Seduta '+sid+'</h3>'+
      '<div class="mut3">'+esc(sd.nome)+' &middot; 30 min</div></div>'+
      '<div class="seg"><button data-act="done" data-v="1" class="'+(w.done===true?"on":"")+'">Fatta</button>'+
      '<button data-act="done" data-v="0" class="'+(w.done===false?"on":"")+'">No</button></div></div>';
    if(w.done===true){
      h+='<p class="mut3" style="margin:13px 0 2px">TOCCA SOLO SE E ANDATA DIVERSAMENTE</p>';
      sd.ex.forEach(function(e){
        var v=(w.ex&&w.ex[e[0]])||0;
        var note=v===1?" &middot; piu del previsto":(v===-1?" &middot; meno del previsto":"");
        h+='<div class="exr"><div class="n">'+esc(e[0])+'<div class="p">'+esc(e[1])+note+'</div></div>'+
          '<button class="pm '+(v===-1?"dn":"")+'" data-act="ex" data-n="'+esc(e[0])+'" data-v="-1">&minus;</button>'+
          '<button class="pm '+(v===1?"up":"")+'" data-act="ex" data-n="'+esc(e[0])+'" data-v="1">+</button></div>'; });
      var hint=progHint(sd.ex.map(function(e){return e[0];}));
      if(hint) h+='<div class="tip">'+hint+'</div>';
    }
    h+='</div>';
  }

  var prev=prevSession(d);
  if(prev){
    var a=S.work[prev.d].anca;
    h+='<div class="card"><div class="mut">Come stanno le anche oggi?</div>'+
      '<div class="mut3" style="margin-bottom:9px">Riferito alla seduta '+(prev.s||"")+' di '+(prev.d===shift(d,-1)?"ieri":label(prev.d).toLowerCase())+'</div>'+
      '<div class="g4">'+[0,1,2,3].map(function(v){ return '<button class="'+(a===v?"on":"")+'" data-act="anca" data-d="'+prev.d+'" data-v="'+v+'">'+v+'</button>'; }).join("")+'</div>'+
      '<p class="mut3" style="margin-top:7px">0 niente &middot; 1 lo sento ma passa &middot; 2 fastidio tutto il giorno &middot; 3 dolore</p>'+
      (a>=2?'<div class="tip w">Al 2 dimezzi il range dell\'esercizio sospetto. Al 3 lo togli e resti su ponte e abduzione.</div>':'')+
      '</div>';
  }

  h+='<div class="sec"><h2>Calendario sedute</h2><div class="card" style="margin:0">'+
    '<p class="mut3">Quale seduta in quale giorno. Cambiala quando vuoi: l\'app usa questo per sapere se oggi e giorno di allenamento.</p>';
  [1,2,3,4,5,6,0].forEach(function(i){ h+=schedRow(i); });
  h+='</div></div>';
  h+='<div class="sec"><h2>Piano allenamento</h2><div class="card" style="margin:0;padding-top:2px;padding-bottom:2px">'+planAllenamento()+'</div></div>';
  return h;
}
function schedRow(i){
  var v=S.sched[String(i)]||"";
  return '<div class="sp" style="padding:6px 0;border-top:1px solid var(--line)"><span style="font-size:13.5px">'+DOW[i]+'</span>'+
    '<select data-act="sched" data-i="'+i+'" style="width:auto;padding:6px 8px">'+
    ["","A","B","C","D"].map(function(o){ return '<option value="'+o+'"'+(o===v?" selected":"")+'>'+(o||"riposo")+'</option>'; }).join("")+'</select></div>';
}
function prevSession(d){
  for(var i=1;i<=7;i++){ var p=shift(d,-i); var w=S.work[p];
    if(w&&w.done===true) return {d:p,s:sedutaDi(p)}; }
  return null;
}
function progHint(names){
  for(var j=0;j<names.length;j++){
    var n=names[j], up=0, dn=0;
    var ds=Object.keys(S.work).sort().reverse();
    for(var i=0;i<ds.length;i++){ var w=S.work[ds[i]];
      if(!w.done||!w.ex||!(n in w.ex)) continue;
      var v=w.ex[n];
      if(v===1&&dn===0) up++; else if(v===-1&&up===0) dn++; else break;
      if(up>=2||dn>=2) break; }
    if(up>=2) return esc(n)+": seconda volta sopra il previsto. La prossima aumenta &mdash; elastico piu duro, mani piu in basso, o un giro in piu.";
    if(dn>=2) return esc(n)+": seconda volta sotto il previsto. Resta sui numeri attuali invece di aumentare.";
  }
  return null;
}

    (S.lastBackup?'<p class="mut3">Ultimo backup: '+esc(S.lastBackup)+'</p>':'<p class="mut3" style="color:var(--warn)">Non hai mai fatto un backup.</p>')+
    '<button class="btn sec" data-act="export">Esporta backup</button>'+
    '<button class="btn sec" data-act="import">Importa backup</button>'+
    '<input type="file" id="fileimp" accept="application/json,.json" style="display:none">'+
    '<button class="btn sec" data-act="reset" style="color:var(--dn);border-color:var(--dn)">Cancella tutti i dati</button></div>';
  return h;

function avgLast(o,d,n){ var s=0,c=0;
  for(var i=0;i<n;i++){ var k=shift(d,-i); var v=o[k];
    if(v!==undefined&&v!==null&&v!==""){ s+=Number(v); c++; } }
  return c? s/c : null; }
function deltaAvg(o,d,n){ var a=avgLast(o,d,n), b=avgLast(o,shift(d,-n),n); return (a!==null&&b!==null)? a-b : null; }

function viewGrafici(){
  var h='<div class="hd"><div class="hdr"><div class="dt">Grafici<small>Ultime 8 settimane</small></div></div></div>';
  var days=lastDays(cur,56);
  var kc=days.map(function(d){ var t=totals(d); return t.k>0?t.k:null; });
  h+=cc("Calorie giornaliere","Punti = giorni, linea = media 7 giorni",line(days,kc,mov(kc,7),1400,3000,null));
  var pr=days.map(function(d){ var t=totals(d); return t.k>0?t.p:null; });
  h+=cc("Proteine giornaliere","La riga tratteggiata e il target di 140 g",line(days,pr,mov(pr,7),60,200,140));
  var wv=days.map(function(d){ return S.weights[d]!==undefined?Number(S.weights[d]):null; });
  h+=cc("Peso","Punti giornalieri, linea = media 7 giorni",line(days,wv,mov(wv,7),null,null,null));
  var vv=days.map(function(d){ return (S.meas[d]&&S.meas[d].vita)?Number(S.meas[d].vita):null; });
  h+=cc("Girovita","Sotto, le sedute fatte nelle stesse settimane: un girovita fermo si legge solo insieme all\'aderenza",
    line(days,vv,null,null,null,null)+weeksBars(days));
  h+=cc("Sedute a settimana","Target 4",sessBar(days));
  h+=cc("Voto anca","Arancione = parte bassa (B, D), blu = parte alta (A, C)",ancaChart(days));
  h+='<div class="sec"><h2>Progressione per esercizio</h2><div class="card" style="margin:0">'+progList()+'</div></div>';
  return h;
}
function cc(t,s,svg){ return '<div class="sec"><h2>'+t+'</h2><div class="card" style="margin:0">'+
  '<p class="mut3" style="margin:0 0 8px">'+s+'</p>'+svg+'</div></div>'; }
function lastDays(d,n){ var a=[]; for(var i=n-1;i>=0;i--) a.push(shift(d,-i)); return a; }
function mov(arr,n){ return arr.map(function(_,i){ var s=0,c=0;
  for(var j=Math.max(0,i-n+1);j<=i;j++){ if(arr[j]!==null&&!isNaN(arr[j])){ s+=arr[j]; c++; } }
  return c>=3? s/c : null; }); }

function line(days,pts,avg,fmin,fmax,ref){
  var W=300,H=112,L=26,R=4,T=6,B=15;
  var vals=pts.filter(function(v){return v!==null&&!isNaN(v);});
  if(avg) vals=vals.concat(avg.filter(function(v){return v!==null&&!isNaN(v);}));
  if(!vals.length) return '<p class="mut3">Nessun dato ancora.</p>';
  if(ref) vals.push(ref);
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(fmin!==null&&fmin!==undefined) lo=Math.min(lo,fmin);
  if(fmax!==null&&fmax!==undefined) hi=Math.max(hi,fmax);
  if(hi-lo<1){ hi+=1; lo-=1; }
  var pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  var X=function(i){ return L+i*(W-L-R)/Math.max(1,days.length-1); };
  var Y=function(v){ return T+(hi-v)/(hi-lo)*(H-T-B); };
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [0,0.5,1].forEach(function(f){ var y=T+f*(H-T-B);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--line)"/>'+
       '<text x="0" y="'+(y+3)+'" font-size="8" fill="var(--tx3)">'+r0(hi-f*(hi-lo))+'</text>'; });
  if(ref) g+='<line x1="'+L+'" y1="'+r1(Y(ref))+'" x2="'+W+'" y2="'+r1(Y(ref))+'" stroke="var(--acc)" stroke-dasharray="3 3"/>';
  pts.forEach(function(v,i){ if(v!==null&&!isNaN(v)) g+='<circle cx="'+r1(X(i))+'" cy="'+r1(Y(v))+'" r="1.8" fill="var(--tx3)"/>'; });
  var src=avg||pts, seg=[];
  src.forEach(function(v,i){ if(v!==null&&!isNaN(v)) seg.push(r1(X(i))+","+r1(Y(v))); });
  if(seg.length>1) g+='<polyline points="'+seg.join(" ")+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>';
  [0,Math.floor(days.length/2),days.length-1].forEach(function(i){ var p=parse(days[i]);
    g+='<text x="'+r1(X(i))+'" y="'+(H-2)+'" font-size="8" fill="var(--tx3)" text-anchor="middle">'+p.getDate()+"/"+(p.getMonth()+1)+'</text>'; });
  return g+'</svg>';
}
function buckets(days){ var b=[]; for(var i=0;i<days.length;i+=7) b.push(days.slice(i,i+7)); return b; }
function sessCount(w){ return w.filter(function(d){ return S.work[d]&&S.work[d].done===true; }).length; }
function sessBar(days){
  var b=buckets(days), W=300, n=b.length, bw=(W-6)/n-6, g='<svg viewBox="0 0 300 78" style="width:100%;height:auto">';
  g+='<line x1="0" y1="14" x2="300" y2="14" stroke="var(--line2)" stroke-dasharray="3 3"/>';
  b.forEach(function(w,i){ var c=sessCount(w), hg=Math.max(2,c/5*46), x=4+i*(bw+6);
    g+='<rect x="'+r1(x)+'" y="'+r1(60-hg)+'" width="'+r1(bw)+'" height="'+r1(hg)+'" rx="3" fill="var(--acc)"/>'+
       '<text x="'+r1(x+bw/2)+'" y="73" font-size="8" fill="var(--tx3)" text-anchor="middle">'+(i+1)+'</text>'; });
  var tot=b.reduce(function(a,w){ return a+sessCount(w); },0);
  return g+'</svg><p class="mut3" style="margin:6px 0 0">Media '+r1(tot/Math.max(1,b.length))+' su 4 previste</p>';
}
function weeksBars(days){
  var b=buckets(days), W=300, n=b.length, bw=(W-6)/n-6, g='<svg viewBox="0 0 300 26" style="width:100%;height:auto;margin-top:2px">';
  b.forEach(function(w,i){ var c=sessCount(w), x=4+i*(bw+6);
    g+='<rect x="'+r1(x)+'" y="'+(20-c*4)+'" width="'+r1(bw)+'" height="'+Math.max(2,c*4)+'" rx="2" fill="var(--tx3)"/>'; });
  return g+'</svg>';
}
function ancaChart(days){
  var low=[], high=[];
  days.forEach(function(d,i){ var w=S.work[d];
    if(!w||w.done!==true||w.anca===undefined||w.anca===null) return;
    var s=sedutaDi(d); ((s==="B"||s==="D")?low:high).push([i,w.anca]); });
  if(!low.length&&!high.length) return '<p class="mut3">Compare quando registri il voto anca dopo qualche seduta.</p>';
  var W=300,H=96,L=18,T=6,B=14;
  var X=function(i){ return L+i*(W-L-4)/Math.max(1,days.length-1); };
  var Y=function(v){ return T+(3-v)/3*(H-T-B); };
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [0,1,2,3].forEach(function(v){ g+='<line x1="'+L+'" y1="'+r1(Y(v))+'" x2="'+W+'" y2="'+r1(Y(v))+'" stroke="var(--line)"/>'+
    '<text x="2" y="'+r1(Y(v)+3)+'" font-size="8" fill="var(--tx3)">'+v+'</text>'; });
  [[low,"var(--orange)"],[high,"var(--acc)"]].forEach(function(pair){
    var arr=pair[0], col=pair[1];
    if(arr.length>1) g+='<polyline points="'+arr.map(function(p){ return r1(X(p[0]))+","+r1(Y(p[1])); }).join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>';
    arr.forEach(function(p){ g+='<circle cx="'+r1(X(p[0]))+'" cy="'+r1(Y(p[1]))+'" r="3" fill="'+col+'"/>'; });
  });
  g+='</svg>';
  var av=function(a){ return a.length? a.reduce(function(s,p){return s+p[1];},0)/a.length : null; };
  var al=av(low), ah=av(high);
  if(low.length>=6&&al!==null&&ah!==null&&al-ah>=0.7)
    g+='<div class="tip w">La parte bassa da mediamente '+r1(al)+' contro '+r1(ah)+' della parte alta. Il problema e nella seduta B, non nell\'allenarti in generale.</div>';
  else if(low.length<6)
    g+='<p class="mut3" style="margin-top:8px">Servono almeno 6 sedute di parte bassa con voto registrato prima che i confronti automatici abbiano senso. Per ora l\'app mostra solo i dati.</p>';
  return g;
}
function progList(){
  var sc={};
  Object.keys(S.work).forEach(function(d){ var w=S.work[d];
    if(w.done!==true||!w.ex) return;
    for(var n in w.ex){ sc[n]=(sc[n]||0)+w.ex[n]; } });
  var ks=Object.keys(sc).filter(function(n){ return sc[n]!==0; }).sort(function(a,b){ return sc[b]-sc[a]; });
  if(!ks.length) return '<p class="mut3">Compare quando segni qualche esercizio sopra o sotto il previsto.</p>';
  var mx=Math.max.apply(null,ks.map(function(n){ return Math.abs(sc[n]); }));
  var h="";
  ks.forEach(function(n){ var v=sc[n];
    h+='<div class="row" style="margin-bottom:8px"><div style="flex:1;min-width:0;font-size:12.5px">'+esc(n)+'</div>'+
      '<div class="bar s" style="width:84px;flex:none"><i style="width:'+(Math.abs(v)/mx*100)+'%;background:'+(v>0?"var(--ok)":"var(--orange)")+'"></i></div>'+
      '<div style="width:26px;text-align:right;font-size:11.5px;color:var(--tx2)">'+(v>0?"+":"")+v+'</div></div>'; });
  var neg=ks.filter(function(n){ return sc[n]<=-2; });
  if(neg.length) h+='<div class="tip w">'+esc(neg[0])+' e in negativo. Se e un esercizio che carica il gomito o l\'anca, valuta se toglierlo invece di insistere.</div>';
  return h;
}

    '<p><b>Poco condito.</b> Il rischio non e sforare i grassi, e stare sotto i 55 g. Il regolatore e la frutta secca e le fonti proteiche piu grasse, non aggiungere olio ai piatti.</p>'+

  h+='<details><summary>Alcol e integrazione</summary><div class="mut" style="padding-bottom:10px">'+
    '<p><b>Alcol.</b> 1-2 drink, 1-2 volte a settimana. Distillato liscio ~70 kcal, calice di vino ~120, birra media ~200, cocktail 300-400. Bevi a pasto, non a stomaco vuoto con gli stuzzichini. Per compensare togli la frutta secca e 5 g di olio: non saltare pasti.</p>'+
    '<p><b>Creatina monoidrato</b> 3-5 g al giorno, sempre, orario indifferente. Nessun carico, nessun ciclo.</p>'+

    '<p>Peso fermo e girovita che cala = sta funzionando, e la ricomposizione. Peso su e girovita fermo nelle prime 3 settimane = creatina e glicogeno. Entrambi fermi dopo 8 settimane = si tolgono 100-150 kcal.</p></div></details>';

function planAllenamento(){
  var h='<details><summary>Come progredire</summary><div class="mut" style="padding-bottom:10px">'+
    '<p>Con 3 kg di manubri non puoi aumentare il peso: la progressione va per leve, una alla volta. Settimane 1-2 impari i movimenti con 2 serie. 3-4 sali al numero di serie previsto. 5-6 sali nelle ripetizioni e passi all\'elastico piu duro. 7-8 rallenti: 3 secondi in discesa, 1 di pausa. Settimana 9 scarica a meta serie, poi riparti dalla 3 con i numeri piu alti.</p>'+
    '<p><b>Doppia progressione.</b> Quando raggiungi il massimo di ripetizioni in tutte le serie, la volta dopo aumenti la difficolta. Altrimenti resti dove sei.</p></div></details>';
  h+='<details><summary>A che ora allenarti</summary><div class="mut" style="padding-bottom:10px">'+
    '<p>Quando riesci: la costanza vale piu dell\'orario. Cambia solo il riscaldamento. <b>Entro un\'ora dal risveglio:</b> 8 minuti invece di 5, prima serie al 70%, e lo stacco rumeno con il range piu corto della giornata. <b>Pomeriggio:</b> 5 minuti, sei gia caldo, e la fascia migliore. <b>Dopo cena:</b> lascia 2 ore e togli la seduta D.</p></div></details>';
  h+='<details><summary>Dolore: come leggerlo</summary><div class="mut" style="padding-bottom:10px">'+
    '<p><b>Indolenzimento normale:</b> nella pancia del muscolo, diffuso, sordo, compare dopo 24-48 ore, migliora muovendosi.</p>'+
    '<p><b>Segnale da fermarsi:</b> nell\'inguine o davanti all\'anca, in un punto preciso, acuto o che aggancia, presente durante l\'esercizio o appena ti alzi, peggiora col movimento.</p>'+
    '<p>Sequenza: dimezzi l\'ampiezza. Se dopo una settimana resta, togli l\'esercizio. Se il fastidio c\'e anche senza allenarti o ti sveglia la notte, chiami l\'ortopedico. Non si spinge attraverso un pizzicore inguinale.</p></div></details>';
  h+='<details><summary>Cosa non fare mai</summary><div class="mut" style="padding-bottom:10px"><ul>'+
    ["Squat profondo e ogni discesa sotto il parallelo","Affondi profondi, soprattutto con tenuta in basso",
     "Step-up su rialzi sopra i 20-25 cm","Sit-up, gambe sollevate, crunch con i piedi bloccati",
     "Rotazione dell'anca sotto carico","Cyclette con sella bassa e spinning",
     "Stretching a piccione e allungamento aggressivo dei flessori dell'anca",
     "Corsa e salti ripetuti nei primi mesi","Stare seduto a lungo con le ginocchia sopra le anche"
    ].map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul></div></details>';
  h+='<details><summary>Quando hai solo 15 minuti</summary><div class="mut" style="padding-bottom:10px">'+
    '<p>Fai i primi tre esercizi della seduta prevista, riscaldamento ridotto a 3 minuti. Non conta come seduta saltata, ma se in una settimana ne fai piu di due, la settimana dopo non aumentare niente.</p></div></details>';
  h+='<details><summary>I 23 esercizi con i diagrammi</summary><div style="padding-bottom:6px">';
  DB.ex.forEach(function(e){
    h+='<details><summary style="font-size:13.5px">'+esc(e.n)+'</summary>'+
      '<div class="dgw" style="padding:0 0 10px"><div class="mut3">Sedute: '+esc(e.sed)+'</div>'+e.svg+
      '<div class="mut" style="margin:4px 0">'+esc(e.come)+'</div>'+
      '<ul class="att">'+e.att.map(function(a){ return '<li>'+a+'</li>'; }).join("")+'</ul></div></details>'; });
  return h+'</div></details>';
}

function render(){
  document.getElementById("app").innerHTML =
    tab==="oggi"?viewOggi():tab==="allen"?viewAllen():tab==="misure"?viewMisure():viewGrafici();
  document.getElementById("tabs").innerHTML = viewTabs();
  document.getElementById("modal").innerHTML = sheet? viewSheet() : "";
  var q=document.getElementById("q");
  if(q){ q.oninput=function(e){ sheet.q=e.target.value; render();
    var n=document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }; }
  var gin=document.getElementById("gin");
  if(gin) gin.oninput=function(e){ sheet.g=Number(e.target.value)||0; };
}

document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act]");
  if(!el){ if(e.target.id==="shbg") closeSheet(); return; }
  var a=el.getAttribute("data-act"), d=cur;

  if(a==="tab"){ tab=el.getAttribute("data-k"); window.scrollTo(0,0); render(); return; }
  if(a==="prev"){ cur=shift(cur,-1); render(); return; }
  if(a==="next"){ cur=shift(cur,1); render(); return; }
  if(a==="tr"){ day(d).train = el.getAttribute("data-v")==="1"; save(); render(); return; }
  if(a==="sup"){ var k=el.getAttribute("data-k"); var x=day(d); x.supp[k]=!x.supp[k]; save(); render(); return; }
  if(a==="w"){ var y=day(d); y.water=Math.max(0,(y.water||0)+Number(el.getAttribute("data-v"))); save(); render(); return; }
  if(a==="add"){ openSheet(el.getAttribute("data-mk")); return; }
  if(a==="del"){ delItem(d, el.getAttribute("data-mk"), Number(el.getAttribute("data-i"))); return; }
  if(a==="closesh"){ closeSheet(); return; }
  if(a==="mode"){ sheet.mode=el.getAttribute("data-k"); sheet.q=""; render(); return; }
  if(a==="back"){ sheet.sel=null; render(); return; }

  if(a==="pickmeal"){
    var o=DB.meals[sheet.mk][Number(el.getAttribute("data-i"))];
    o.items.forEach(function(p){ var m=macroOf(p[0],p[1]); if(m) day(d).meals[sheet.mk].push(m); });
    var f0=o.items[0][0];
    S.recents=[f0].concat(S.recents.filter(function(z){return z!==f0;})).slice(0,14);
    save(); closeSheet(); return; }
  if(a==="pickfood"){ sheet.sel={type:"food",name:el.getAttribute("data-n")}; sheet.g=100; render(); return; }
  if(a==="editfood"){ sheet.sel={type:"edit",name:el.getAttribute("data-n")}; render(); return; }
  if(a==="setg"){ sheet.g=Number(el.getAttribute("data-g")); render(); return; }
  if(a==="dg"){ var cg=Number(document.getElementById("gin").value)||0;
    sheet.g=Math.max(0,cg+Number(el.getAttribute("data-v"))); render(); return; }
  if(a==="confirmfood"){
    var g=Number(document.getElementById("gin").value)||0;
    if(g<=0){ alert("Inserisci una quantita maggiore di zero."); return; }
    var mk=sheet.mk, nm=sheet.sel.name; closeSheet(); addItem(d,mk,macroOf(nm,g)); return; }
  if(a==="saveedit"){
    var nn=el.getAttribute("data-n");
    S.over[nn]=["k","p","f","c","fib"].map(function(z){ return Number(document.getElementById("ef_"+z).value)||0; });
    save(); sheet.sel=null; render(); return; }
  if(a==="dish"){
    var qy=Number(el.getAttribute("data-q")), tt=el.getAttribute("data-t");
    var p2=DB.piatti.filter(function(z){ return z.t===tt; })[0];
    var mk2=sheet.mk; closeSheet();
    addItem(d,mk2,{n:(qy===0.5?"Mezza porzione: ":"")+p2.t,g:0,k:p2.k*qy,p:p2.p*qy,f:p2.f*qy,c:p2.c*qy,fib:p2.fib*qy});
    return; }
  if(a==="savenew"){
    var nname=document.getElementById("nf_n").value.trim();
    if(!nname){ alert("Serve il nome dell'alimento."); return; }
    var vv=["k","p","f","c","fib"].map(function(z){ return Number(document.getElementById("nf_"+z).value)||0; });
    if(vv[0]<=0){ alert("Serve almeno il valore delle calorie per 100 g."); return; }
    S.custom[nname]=vv; save();
    sheet.mode="cibi"; sheet.sel={type:"food",name:nname}; sheet.g=100; render(); return; }
  if(a==="savestima"){
    var sn=document.getElementById("st_n").value.trim()||"Stima rapida";
    var sk=Number(document.getElementById("st_k").value)||0;
    var sp=Number(document.getElementById("st_p").value)||0;
    if(sk<=0){ alert("Serve almeno una stima delle calorie."); return; }
    var mk3=sheet.mk; closeSheet();
    var restk=Math.max(0,sk-sp*4);
    addItem(d,mk3,{n:sn,g:0,k:sk,p:sp,f:restk*0.33/9,c:restk*0.55/4,fib:0});
    return; }

  if(a==="done"){ var w=wk(d); w.done = el.getAttribute("data-v")==="1";
    if(!w.ex) w.ex={}; if(!w.seduta) w.seduta=sedutaDi(d); save(); render(); return; }
  if(a==="setsed"){ var w2=wk(d); w2.seduta=el.getAttribute("data-s"); w2.done=true; w2.ex={}; save(); render(); return; }
  if(a==="ex"){ var w3=wk(d); if(!w3.ex) w3.ex={};
    var en=el.getAttribute("data-n"), ev=Number(el.getAttribute("data-v"));
    w3.ex[en] = (w3.ex[en]===ev)? 0 : ev; save(); render(); return; }
  if(a==="anca"){ var td=el.getAttribute("data-d"); if(!S.work[td]) S.work[td]={};
    S.work[td].anca=Number(el.getAttribute("data-v")); save(); render(); return; }

  if(a==="savew"){ var wv2=document.getElementById("w_in").value;
    if(wv2==="") delete S.weights[d]; else S.weights[d]=Number(wv2); save(); render(); return; }
  if(a==="savem"){ var mv=document.getElementById("m_v").value, mf=document.getElementById("m_f").value;
    S.meas[d]=S.meas[d]||{};
    if(mv==="") delete S.meas[d].vita; else S.meas[d].vita=Number(mv);
    if(mf==="") delete S.meas[d].fianchi; else S.meas[d].fianchi=Number(mf);
    save(); render(); return; }
  if(a==="export"){
    S.lastBackup=label(today()); save();
    var blob=new Blob([JSON.stringify(S)],{type:"application/json"});
    var u=URL.createObjectURL(blob), lk=document.createElement("a");
    lk.href=u; lk.download="ricomposizione-backup-"+today()+".json";
    document.body.appendChild(lk); lk.click(); document.body.removeChild(lk);
    setTimeout(function(){ URL.revokeObjectURL(u); },2000); render(); return; }
  if(a==="import"){ document.getElementById("fileimp").click(); return; }
  if(a==="reset"){ if(confirm("Cancella davvero tutto lo storico? Non si torna indietro.")){ S=blank(); save(); render(); } return; }
});

document.addEventListener("change", function(e){
  if(e.target.id==="fileimp"){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ try{ var o=JSON.parse(r.result); if(!o.days) throw new Error("bad");
      var b=blank(); for(var k in b) if(!(k in o)) o[k]=b[k];
      S=o; save(); render(); alert("Backup importato."); }
      catch(err){ alert("File non valido."); } };
    r.readAsText(f); return; }
  var el=e.target.closest("[data-act='sched']");
  if(el){ var i=el.getAttribute("data-i"), v=el.value;
    if(v) S.sched[String(i)]=v; else delete S.sched[String(i)];
    save(); render(); }
});

render();
</script>
</body>
</html>
